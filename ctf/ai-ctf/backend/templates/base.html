<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}GAMKERS AI CTF{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#09090b;--bg-secondary:#111113;--bg-card:#18181b;--bg-hover:#1f1f23;
  --border:#27272a;--border-bright:#3f3f46;
  --text:#fafafa;--text-dim:#a1a1aa;--text-muted:#71717a;
  --green:#22c55e;--green-dim:#16a34a;--green-glow:rgba(34,197,94,.12);
  --blue:#3b82f6;--blue-dim:#2563eb;
  --yellow:#eab308;--orange:#f97316;--red:#ef4444;
  --purple:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-primary);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--blue);text-decoration:none;transition:.15s}a:hover{color:#60a5fa}
::selection{background:var(--green);color:#000}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:100;background:rgba(9,9,11,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--green);letter-spacing:.5px}
.topbar .brand svg{width:22px;height:22px}
.topbar nav{display:flex;gap:6px;align-items:center}
.topbar nav a{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-dim);transition:.15s}
.topbar nav a:hover{background:var(--bg-hover);color:var(--text)}
.user-chip{background:var(--bg-card);border:1px solid var(--border);padding:4px 12px 4px 8px;border-radius:20px;font-size:12px;font-weight:500;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.user-chip .pts{color:var(--green);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:28px 20px}
.wrap-sm{max-width:480px}
.wrap-lg{max-width:1200px}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;transition:.2s}
.card:hover{border-color:var(--border-bright)}
.card h2{font-size:17px;font-weight:700;margin-bottom:4px}
.card h3{font-size:14px;font-weight:600;color:var(--text-dim);margin-bottom:8px}
.card .sub{font-size:12px;color:var(--text-muted);line-height:1.7}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.8px;text-transform:uppercase;border:1px solid}
.badge.easy{border-color:var(--green);color:var(--green);background:var(--green-glow)}
.badge.medium{border-color:var(--yellow);color:var(--yellow);background:rgba(234,179,8,.08)}
.badge.hard{border-color:var(--orange);color:var(--orange);background:rgba(249,115,22,.08)}
.badge.expert{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:#000}.btn-green:hover{background:var(--green-dim)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-dim)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}.btn-ghost:hover{border-color:var(--text-muted);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}

/* Inputs */
input[type=text],input[type=password]{width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
label{font-size:12px;font-weight:500;color:var(--text-muted);display:block;margin-bottom:5px;margin-top:14px}

/* Alerts */
.alert{border-radius:10px;padding:10px 14px;font-size:12px;font-weight:500;margin-top:10px;display:flex;align-items:center;gap:8px}
.alert-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red)}
.alert-ok{background:var(--green-glow);border:1px solid rgba(34,197,94,.25);color:var(--green)}
.alert-flag{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3);color:var(--yellow);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.3px;word-break:break-all}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:var(--bg-hover)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-up{animation:fadeUp .4s ease both}
.pulse{animation:pulse 1.5s ease-in-out infinite}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <a href="/" class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    GAMKERS CTF
  </a>
  <nav>
    <a href="/">Labs</a>
    <a href="/leaderboard">Leaderboard</a>
    {% if player %}
      <div class="user-chip"><span class="dot"></span>{{ player.handle }} <span class="pts">{{ player.score }}pts</span></div>
    {% else %}
      <a href="/register" class="btn btn-green btn-sm">Join CTF</a>
    {% endif %}
  </nav>
</div>
{% block content %}{% endblock %}
</body>
</html>
